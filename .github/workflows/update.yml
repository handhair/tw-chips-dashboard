# 每個交易日收盤後抓最新籌碼資料，commit 回儲存庫，再發布到 GitHub Pages
name: 更新籌碼資料並發布

on:
  schedule:
    # 週一到週五 09:30 UTC = 台灣時間下午 5:30（法人與融資資料都公布之後；GitHub 排程可能晚 5～30 分鐘）
    - cron: "30 9 * * 1-5"
  # 改了網頁或程式推上來時也重新發布
  push:
    branches: [main]
  # 讓你可以在 GitHub 網頁上按按鈕手動執行
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 補抓新的交易日
        if: github.event_name != 'push'
        env:
          TZ: Asia/Taipei
        run: python chips.py
      - name: 有新資料就 commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chips_data.json
          git diff --cached --quiet || git commit -m "更新籌碼資料 $(TZ=Asia/Taipei date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
